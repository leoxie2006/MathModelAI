name: "execute-python-script"
command: "/bin/bash"
args:
  - "-c"
  - |
    set -euo pipefail

    SCRIPT_CONTENT="$1"
    ENV_NAME="${2:-default}"
    ADDITIONAL_ARGS="${3:-}"

    detect_project_root() {
      if [ -n "${MATHMODEL_ROOT:-}" ] && [ -d "${MATHMODEL_ROOT}" ]; then
        printf '%s\n' "${MATHMODEL_ROOT}"
        return
      fi
      if command -v git >/dev/null 2>&1; then
        local root_path
        if root_path=$(git rev-parse --show-toplevel 2>/dev/null); then
          printf '%s\n' "$root_path"
          return
        fi
      fi
      printf '%s\n' "$(pwd)"
    }

    resolve_env_dir() {
      local requested="$1"
      if [ -n "${VIRTUAL_ENV:-}" ] && { [ -z "$requested" ] || [ "$requested" = "default" ]; }; then
        printf '%s\n' "$VIRTUAL_ENV"
        return
      fi
      local root
      root="$(detect_project_root)"
      if [ -z "$requested" ] || [ "$requested" = "default" ]; then
        printf '%s/venv\n' "$root"
        return
      fi
      printf '%s/.venvs/%s\n' "$root" "$requested"
    }

    ENV_DIR="$(resolve_env_dir "$ENV_NAME")"
    mkdir -p "$(dirname "$ENV_DIR")"
    if [ ! -d "$ENV_DIR" ]; then
      python3 -m venv "$ENV_DIR"
    fi

    # shellcheck disable=SC1090
    source "$ENV_DIR/bin/activate"

    if [ -n "$ADDITIONAL_ARGS" ]; then
      python3 $ADDITIONAL_ARGS -c "$SCRIPT_CONTENT"
    else
      python3 -c "$SCRIPT_CONTENT"
    fi
  - "_"
enabled: true
short_description: "在虚拟环境中执行 Python 建模脚本"
description: |
  在项目虚拟环境中执行 Python 代码片段，用于数学建模计算、数据处理、仿真、优化和可视化验证。
parameters:
  - name: "script"
    type: "string"
    description: "要执行的 Python 脚本内容，支持多行。"
    required: true
    position: 0
    format: "positional"
  - name: "env_name"
    type: "string"
    description: "虚拟环境名称，默认使用项目根目录下的 venv。"
    required: false
    default: "default"
    position: 1
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "传给 python3 的额外参数，例如 -W ignore。"
    required: false
    default: ""
    position: 2
    format: "positional"
