name: "exec"
command: "sh"
args: ["-c"]
enabled: true
short_description: "执行系统命令，用于工程辅助操作"
description: |
  执行系统命令。适合检查文件、运行构建命令、查看环境信息或处理项目辅助任务。

  该工具具有较高权限，只应在可信项目环境中使用。
parameters:
  - name: "command"
    type: "string"
    description: "要执行的 Shell 命令。"
    required: true
    position: 0
    format: "positional"
  - name: "shell"
    type: "string"
    description: "Shell 类型，默认 sh。"
    required: false
    default: "sh"
  - name: "workdir"
    type: "string"
    description: "命令执行的工作目录。"
    required: false
  - name: "additional_args"
    type: "string"
    description: "额外参数。"
    required: false
    format: "positional"
