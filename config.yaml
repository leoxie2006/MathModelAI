# MathModelAI 最小配置
# 保留能力:对话 / 多代理 / MCP / 知识库 / 项目黑板 / Skills / 角色 / 配置页面
# 已移除:c2 / robots / vision / fofa / attackchain / webshell / vulnerability / terminal / batch 等

version: "v0.1.0"

server:
  host: 0.0.0.0
  port: 8080
  tls_enabled: false
  tls_auto_self_sign: true

auth:
  password: bc3g8QKyqaW55IaSamaNhh5b
  session_duration_hours: 12

log:
  level: info
  output: stdout

audit:
  enabled: true
  retention_days: 15
  max_detail_bytes: 8192
  auth_failure_cooldown_seconds: 60

openai:
  provider: openai
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: sk-xxxxxxx
  model: qwen3-max
  max_total_tokens: 120000
  reasoning:
    mode: on
    effort: high
    allow_client_reasoning: true
    profile: openai_compat

agent:
  max_iterations: 12000
  large_result_threshold: 102400
  result_storage_dir: tmp
  tool_timeout_minutes: 60
  system_prompt_path: ""

hitl:
  tool_whitelist: [read_file, list_dir, glob, grep]

multi_agent:
  enabled: true
  robot_default_agent_mode: eino_single
  batch_use_multi_agent: false
  max_iteration: 0
  plan_execute_loop_max_iterations: 0
  sub_agent_max_iterations: 120
  sub_agent_user_context_max_runes: 0
  without_general_sub_agent: false
  without_write_todos: false
  orchestrator_instruction: ""
  orchestrator_instruction_plan_execute: ""
  orchestrator_instruction_supervisor: ""
  eino_skills:
    disable: false
    filesystem_tools: true
    skill_tool_name: skill
  eino_middleware:
    patch_tool_calls: true
    tool_search_enable: true
    tool_search_min_tools: 20
    tool_search_always_visible: 12
    tool_search_always_visible_tools: [read_file, glob, grep, analyze_image, write_file, edit_file, execute, task, transfer_to_agent, exit, write_todos, skill, tool_search, TaskCreate, TaskGet, TaskUpdate, TaskList, search_knowledge_base, execute-python-script, exec]
    plantask_enable: false
    plantask_rel_dir: .eino/plantask
    reduction_enable: true
    reduction_max_length_for_trunc: 50000
    reduction_max_tokens_for_clear: 160000
    reduction_root_dir: ""
    reduction_clear_exclude: []
    reduction_sub_agents: true
    summarization_trigger_ratio: 0.8
    summarization_emit_internal_events: true
    plan_execute_user_input_budget_ratio: 0.35
    plan_execute_executed_steps_budget_ratio: 0.2
    plan_execute_max_step_result_runes: 4000
    plan_execute_keep_last_steps: 8
    checkpoint_dir: ""
    run_retry_max_attempts: 0
    run_retry_max_backoff_sec: 0
    deep_output_key: ""
    deep_model_retry_max_retries: 0
    task_tool_description_prefix: ""
  eino_callbacks:
    enabled: true
    mode: log_only
    sse_trace_to_client: false
    max_input_summary_runes: 400
    max_output_summary_runes: 400
    zap_verbose: false
    otel:
      enabled: true
      service_name: mathmodel-ai
      exporter: stdout
      otlp_endpoint: localhost:4318
      sample_ratio: 1.0

database:
  path: data/conversations.db
  knowledge_db_path: data/knowledge.db

mcp:
  enabled: false
  host: 0.0.0.0
  port: 8081
  auth_header: "X-MCP-Token"
  auth_header_value: ""

external_mcp:
  servers: {}

knowledge:
  enabled: false
  base_path: knowledge_base
  embedding:
    provider: openai
    model: text-embedding-v4
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: sk-xxxxxxx
  retrieval:
    top_k: 5
    similarity_threshold: 0.4
    post_retrieve:
      prefetch_top_k: 0
      max_context_chars: 0
      max_context_tokens: 0
    sub_index_filter: ""
  indexing:
    chunk_size: 512
    chunk_overlap: 50
    max_chunks_per_item: 0
    max_rpm: 0
    rate_limit_delay_ms: 300
    max_retries: 3
    retry_delay_ms: 1000
    chunk_strategy: markdown_then_recursive
    request_timeout_seconds: 120
    prefer_source_file: false
    batch_size: 10
    sub_indexes: []

skills_dir: skills
agents_dir: agents
roles_dir: roles

project:
  enabled: true
  fact_index_max_runes: 3500
  fact_summary_max_runes: 240
  default_inject_deprecated: false

security:
  tools_dir: tools
  tool_description_mode: full
